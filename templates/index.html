<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="quiz-card">
        <header>
            <h1>Викторина 🎯</h1>
            <p id="subtitle">Выбери тему</p>
        </header>

        <!-- Экран выбора викторины -->
        <div id="quiz-picker">
            <!-- Кнопки тем генерируются через JS -->
        </div>

        <!-- Экран самой игры -->
        <div id="game" style="display: none;">
            <div id="game-stats">
                <span>Раунд: <b id="round">1</b>/<b id="total-rounds">?</b></span>
                <span>Счет: <b id="score">0</b></span>
            </div>

            <div id="game-arena">
                <div id="question-text">Загрузка вопроса…</div>
                <img id="question-photo" alt="" />
            </div>

            <div id="options-container"></div>

            <div id="feedback">
                <p id="message">Выбери вариант ответа</p>
            </div>

            <div id="controls">
                <button id="next-btn" disabled>Следующий вопрос</button>
                <button id="restart-btn">Заново</button>
                <button id="back-btn">Сменить тему</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=100"></script>
</body>
</html>
